<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCFCFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181A" media="(prefers-color-scheme: dark)">
<title>노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app" class="app">

  <!-- ── 왼쪽: 목록 ─────────────────────────────── -->
  <aside class="pane-list" id="paneList">
    <header class="list-head">
      <div class="search-row">
        <input id="search" type="search" placeholder="검색" autocomplete="off" spellcheck="false">
        <button id="btnNew" class="icon-btn" title="새 노트 (Ctrl/Cmd+N)" aria-label="새 노트">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
        </button>
      </div>
      <div id="tagBar" class="tag-bar"></div>
    </header>

    <div id="noteList" class="note-list" role="list"></div>

    <footer class="list-foot">
      <button id="btnSync" class="foot-btn" title="지금 동기화">
        <span id="syncDot" class="dot" data-state="off"></span>
        <span id="syncLabel">연결 안 됨</span>
      </button>
      <button id="btnSettings" class="foot-btn" aria-label="설정">설정</button>
    </footer>
  </aside>

  <!-- ── 오른쪽: 편집기 ───────────────────────────── -->
  <main class="pane-editor" id="paneEditor">
    <div class="editor-bar">
      <button id="btnBack" class="icon-btn only-narrow" aria-label="목록으로">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <span id="stamp" class="stamp"></span>
      <div class="bar-spacer"></div>
      <button id="btnPreview" class="text-btn" aria-pressed="false">미리보기</button>
      <div class="menu-wrap">
        <button id="btnMore" class="icon-btn" aria-label="더보기" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="4.5" r="1.4" fill="currentColor"/><circle cx="10" cy="10" r="1.4" fill="currentColor"/><circle cx="10" cy="15.5" r="1.4" fill="currentColor"/></svg>
        </button>
        <div id="moreMenu" class="menu" hidden>
          <button data-act="md">마크다운으로 내보내기</button>
          <button data-act="docx">Word(.docx)로 내보내기</button>
          <button data-act="pdf">PDF로 인쇄</button>
          <hr>
          <button data-act="delete" class="danger">노트 삭제</button>
        </div>
      </div>
    </div>

    <textarea id="editor" class="editor" placeholder="여기서부터 쓰세요.&#10;&#10;첫 줄이 제목이 됩니다. 본문 아무 데나 #태그 를 적으면 자동으로 분류됩니다." spellcheck="false"></textarea>
    <div id="preview" class="preview" hidden></div>

    <div id="empty" class="empty">
      <p>왼쪽에서 노트를 고르거나, 새 노트를 시작하세요.</p>
      <button id="btnNewEmpty" class="primary">새 노트</button>
    </div>
  </main>
</div>

<!-- ── 설정 시트 ──────────────────────────────── -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="설정">
    <div class="sheet-head">
      <h2>설정</h2>
      <button id="btnCloseSheet" class="icon-btn" aria-label="닫기">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>

    <section class="sheet-sec">
      <h3>구글 드라이브 동기화</h3>
      <p class="hint">구글 클라우드 콘솔에서 만든 OAuth 클라이언트 ID를 넣으세요. 설정 방법은 README에 있습니다. 이 앱은 자기가 만든 파일만 접근합니다.</p>
      <label class="field">
        <span>OAuth 클라이언트 ID</span>
        <input id="clientId" type="text" placeholder="000000-xxxx.apps.googleusercontent.com" autocomplete="off" spellcheck="false">
      </label>
      <label class="field">
        <span>드라이브 폴더 이름</span>
        <input id="folderName" type="text" placeholder="MyNotes" autocomplete="off" spellcheck="false">
      </label>
      <div class="btn-row">
        <button id="btnConnect" class="primary">구글 계정 연결</button>
        <button id="btnDisconnect" class="quiet">연결 해제</button>
      </div>
      <p id="syncMsg" class="hint mono"></p>
    </section>

    <section class="sheet-sec">
      <h3>애플 노트 가져오기</h3>
      <p class="hint">맥 노트 앱에서 마크다운으로 내보낸 <code>.md</code> 파일을 고르세요. 폴더째 선택해도 됩니다. YAML 앞머리의 태그와 본문의 #태그를 모두 읽습니다.</p>
      <div class="btn-row">
        <button id="btnImportFiles" class="quiet">파일 고르기</button>
        <button id="btnImportDir" class="quiet">폴더 고르기</button>
      </div>
      <input id="fileInput" type="file" accept=".md,.markdown,.txt" multiple hidden>
      <input id="dirInput" type="file" webkitdirectory directory multiple hidden>
      <p id="importMsg" class="hint mono"></p>
    </section>

    <section class="sheet-sec">
      <h3>저장 공간</h3>
      <p id="storageMsg" class="hint mono">확인 중…</p>
      <div class="btn-row">
        <button id="btnPersist" class="quiet">이 기기에서 지워지지 않도록 등록</button>
        <button id="btnBackup" class="quiet">전체 백업 내려받기</button>
      </div>
    </section>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<div id="printArea" class="print-area" aria-hidden="true"></div>

<script type="module" src="app.js"></script>
</body>
</html>
